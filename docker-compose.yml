services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: codelens-postgres
    environment:
      POSTGRES_DB: codelens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - codelens_pg_data:/var/lib/postgresql/data
      - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d codelens"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  codelens_pg_data: